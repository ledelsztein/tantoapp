<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0C1A0E"/>

  <!-- Logo icon (caja completa con diagonal) — centrado arriba -->
  <g transform="translate(540, 160)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="#111E13"/>
    <rect x="22" y="22" width="76" height="76" rx="6"
      fill="none" stroke="#D4C9A0" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="24" y1="96" x2="96" y2="24"
      stroke="#D4C9A0" stroke-width="6.5" stroke-linecap="round"/>
  </g>

  <!-- TantoApp -->
  <text x="600" y="360"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="80"
    font-weight="700"
    fill="#EDE8D8"
    text-anchor="middle"
    letter-spacing="-2">TantoApp</text>

  <!-- Subtitle -->
  <text x="600" y="430"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="32"
    font-weight="400"
    fill="#7A9070"
    text-anchor="middle"
    letter-spacing="0">Anotador de Truco, Bazas, Generala, 10 Mil y Burako</text>
</svg>
